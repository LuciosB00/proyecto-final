spring.application.name=stock-ventas

# H2 permite iniciar el proyecto localmente sin configurar un servidor de base de datos.
spring.datasource.url=${DB_URL:jdbc:h2:mem:stock_ventas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Para PostgreSQL, define DB_URL, DB_USER, DB_PASSWORD y DB_DRIVER,
# por ejemplo DB_URL=jdbc:postgresql://localhost:5432/stock_ventas y DB_DRIVER=org.postgresql.Driver.
